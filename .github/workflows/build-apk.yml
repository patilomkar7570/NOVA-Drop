name: Build NOVA Drop Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug assembleRelease || gradle assembleDebug

      - name: Rename APK for release
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-apk/ \;
          ls -la release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVADrop-Android-APK
          path: release-apk/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
